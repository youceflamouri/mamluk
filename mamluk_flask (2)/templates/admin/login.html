{% extends "base.html" %}
{% block content %}
<main class="page-shell">
  <div class="admin-login">
    <h3>{{ 'دخول الإدارة' if is_ar() else 'Admin Login' }}</h3>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
      <label>{{ 'البريد الإلكتروني' if is_ar() else 'Email' }}
        <input name="username" type="email" required maxlength="120" autocomplete="username" />
      </label>
      <label>{{ 'كلمة المرور' if is_ar() else 'Password' }}
        <input name="password" type="password" required maxlength="200" autocomplete="current-password" />
      </label>
      <button type="submit" class="btn primary">{{ 'دخول' if is_ar() else 'Login' }}</button>
    </form>
  </div>
</main>
{% endblock %}
